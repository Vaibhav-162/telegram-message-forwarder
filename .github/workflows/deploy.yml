name: Deploy Telegram Bot to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to GCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "forwarder.py,requirements.txt"
          target: "~/tg-bot"

      - name: Setup environment and restart
        uses: appleboy/ssh-action@v1
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: TG_API_ID,TG_API_HASH
          script: |
            cd ~/tg-bot
            
            # 1. Securely write the .env file
            echo "TG_API_ID=$TG_API_ID" > .env
            echo "TG_API_HASH=$TG_API_HASH" >> .env
            
            # 2. Build the Python virtual environment
            if [ ! -d "botenv" ]; then
              python3 -m venv botenv
            fi
            source botenv/bin/activate
            pip install -r requirements.txt
            
            # 3. Write the background service file
            sudo bash -c "cat > /etc/systemd/system/tg-forwarder.service" << EOF
            [Unit]
            Description=Telegram Forwarder Bot
            After=network.target
            
            [Service]
            User=$USER
            WorkingDirectory=/home/$USER/tg-bot
            ExecStart=/home/$USER/tg-bot/botenv/bin/python /home/$USER/tg-bot/forwarder.py
            Restart=always
            RestartSec=10
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # 4. Apply changes
            sudo systemctl daemon-reload
            sudo systemctl restart tg-forwarder.service